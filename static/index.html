
   <!DOCTYPE html>
   <html lang="en">
   <head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Sign Up / Log In</title>
       <link rel="stylesheet" href="style.css">
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
   </head>
   <body>
       <div class="container" id="container">
           <div class="form-container sign-up-container">
               <form id="signup-form" onsubmit="event.preventDefault(); signup();">
                   <h1>Create Account</h1>
                   <input type="text" placeholder="User name" name="username" required />
                   <input type="email" placeholder="Email" name="email" required />
                   <div class="password-container">
                       <input type="password" class="passwordInput" placeholder="password" name="password" required>
                       <span class="toggle-eye" onclick="togglePassword()">🙈</span>
                   </div>
                   <div class="btn-grad" onclick="signup()">Sign Up</div>
               </form>
           </div>
           <div class="form-container sign-in-container">
               <form id="signin-form" onsubmit="event.preventDefault(); signin();">
                   <h1>Log In</h1>
                   <input type="email" placeholder="Email" name="email" required />
                   <div class="password-container">
                       <input type="password" class="passwordInput" placeholder="password" name="password" required>
                       <span class="toggle-eye" onclick="togglePassword()">🙈</span>
                   </div>
                   <div class="btn-grad" onclick="signin()">Log In</div>
               </form>
           </div>
           <div class="overlay-container">
               <div class="overlay">
                   <div class="overlay-panel overlay-left">
                       <h1>Hello, Buddy!</h1>
                       <button class="ghost" id="LogIn">Sign In</button>
                   </div>
                   <div class="overlay-panel overlay-right">
                       <h1>Hello, Buddy!</h1>
                       <button class="ghost" id="signUp">Sign Up</button>
                   </div>
               </div>
           </div>
       </div>
       <script src="index.js"></script>
   </body>
   </html>
